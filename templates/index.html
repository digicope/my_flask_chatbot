<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 챗봇</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="chat-header">
            <div class="header-left">
                <button class="back-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 18L9 12L15 6" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="header-title-group">
                    <span class="chat-title">AI 챗봇</span>
                    <span class="chat-status">온라인</span>
                </div>
            </div>
            <div class="header-right">
                <button class="header-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 16.92V19.92C22 20.52 21.52 21 20.92 21C10.94 21 3 13.06 3 3.08C3 2.48 3.48 2 4.08 2H7.1C7.56 2 7.97 2.31 8.07 2.76L9.15 7.33C9.25 7.78 9.1 8.25 8.7 8.55L6.8 10C8.14 13.38 10.62 15.86 14 17.2L15.45 15.3C15.75 14.9 16.22 14.75 16.67 14.85L21.24 15.93C21.69 16.03 22 16.44 22 16.9V16.92Z" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="header-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 17C11.45 17 11 16.55 11 16C11 15.45 11.45 15 12 15C12.55 15 13 15.45 13 16C13 16.55 12.55 17 12 17ZM13 13H11V7H13V13Z" fill="#333333"/>
                    </svg>
                </button>
                <button class="header-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="5" r="2" fill="#333333"/>
                        <circle cx="12" cy="12" r="2" fill="#333333"/>
                        <circle cx="12" cy="19" r="2" fill="#333333"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="chat-container">
            <div id="chat-messages" class="chat-messages"></div>
            <div class="input-container">
                <input type="text" id="user-input" placeholder="메시지를 입력하세요..." />
                <button id="send-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 19V5M5 12L12 5L19 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        // 시간 포맷 함수
        function getTimeString() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const ampm = hours >= 12 ? '오후' : '오전';
            const displayHours = hours % 12 || 12;
            const displayMinutes = minutes < 10 ? '0' + minutes : minutes;
            return `${ampm} ${displayHours}:${displayMinutes}`;
        }

        // 메시지 추가 함수
        function addMessage(text, isUser) {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = isUser ? 'message-wrapper user-wrapper' : 'message-wrapper bot-wrapper';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = isUser ? 'message user-message' : 'message bot-message';
            messageDiv.textContent = text;
            
            const timeSpan = document.createElement('span');
            timeSpan.className = 'message-time';
            timeSpan.textContent = getTimeString();
            
            messageWrapper.appendChild(messageDiv);
            messageWrapper.appendChild(timeSpan);
            
            chatMessages.appendChild(messageWrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 메시지 전송 함수
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // 사용자 메시지 표시
            addMessage(message, true);
            userInput.value = '';

            // 전송 버튼 비활성화
            sendButton.disabled = true;
            sendButton.style.opacity = '0.5';

            try {
                // Flask 서버에 요청 전송
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (response.ok) {
                    // 챗봇 응답 표시
                    addMessage(data.response, false);
                } else {
                    // 에러 메시지 표시
                    addMessage('오류: ' + (data.error || '알 수 없는 오류가 발생했습니다.'), false);
                }
            } catch (error) {
                addMessage('오류: 네트워크 연결을 확인해주세요.', false);
                console.error('Error:', error);
            } finally {
                // 전송 버튼 활성화
                sendButton.disabled = false;
                sendButton.style.opacity = '1';
            }
        }

        // 전송 버튼 클릭 이벤트
        sendButton.addEventListener('click', sendMessage);

        // Enter 키 이벤트
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
